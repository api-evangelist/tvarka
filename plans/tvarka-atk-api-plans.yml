rules:
  - No charge for failed, cancelled or expired ceremonies.
  - No charge for sandbox operations.
  - Idempotent service retries do not create a second usage event.
  - Later rate changes do not reprice completed operations.
  - No progressive volume bands and no fractional-cent month-end allocation.
  - The whole-cent rate in effect when an operation completes is snapshotted into the immutable usage record and monthly statement.
  - No subscription, monthly minimum or retrospective repricing.
enterprise: >-
  An enterprise order may agree another whole-cent rate for later operations. Production onboarding
  confirms the enabled methods and their rates before credentials are activated.

