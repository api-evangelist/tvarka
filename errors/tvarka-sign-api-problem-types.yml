note: >-
  Unlike the ATK API, which uses a custom {code, message, requestId} envelope, the Sign API is
  genuinely RFC 9457. The contract declares a Problem schema with type/title/status/detail and
  serves it as application/problem+json.
envelope:
  media_type: application/problem+json
  schema: '#/components/schemas/Problem'
  fields:
    - {name: type, type: string, format: uri, required: true}
    - {name: title, type: string, required: true}
    - {name: status, type: integer, required: true}
    - {name: detail, type: string, required: false}
    - name: errors
      type: array
      items: '#/components/schemas/ProblemFieldError'
      required: false
      note: >-
        Present on validation-failed and on single-fault problems that name a field. Request-body
        validation COLLECTS rather than failing fast, so a caller who got three fields wrong learns
        all three from one response - a materially agent-friendly choice.
    - name: recoveryUrl
      type: string
      format: uri-reference
      required: false
      note: >-
        Present on the payment-required refusal when a web page exists that fixes it - the tenant's
        payment setup, reached with an ordinary browser login. Show it to a human operator; it is
        not an API endpoint an agent should call.
