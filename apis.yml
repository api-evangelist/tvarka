- aid: tvarka-atk-api:tvarka-sign-api
  name: Tvarka Sign API
  description: 'Machine channel for Tvarka Sign: post a document and a list of signers and Tvarka runs its ordinary qualified
    signing ceremony for each of them on the hosted page or in the Tvarka Sign mobile app (LT ATK over NFC, Smart-ID, Mobile-ID).
    Nothing in the API signs anything - a signature is always a human act with the signer''s own eID - so every operation
    is about getting a document in front of the right person and learning what they did. Orchestration sibling of the card-level
    ATK API; RFC 9457 problem details, HMAC-signed webhooks, and a hosted MCP server.'
