name: Tvarka ATK API
description: >-
  A single REST API for Lithuanian eID authentication and qualified electronic signing (QES), plus validation,
  timestamping and long-term-validation (LTV)/archive trust services. The primary ceremonies read the Lithuanian
  identity card (ATK) through a physical smart-card reader or an NFC phone tap, with Smart-ID and Mobile-ID as
  optional server-side methods under the same request, polling, webhook and metering model. Signing produces PAdES,
  ASiC-E, ADOC or detached CAdES artifacts with a qualified timestamp and an advisory validation axis. eIDAS-aligned
  and EU-resident, operated from Lithuania by Advokato M. Kiskio kontora INVENT and Socialiniai algoritmai, UAB, and
  priced per successful operation with no subscription or minimum.
