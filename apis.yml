name: Tvarka ATK API
description: A single REST API estate for Lithuanian eID authentication and qualified electronic signing (QES). The ATK API
  reads the Lithuanian identity card itself - physical smart-card reader or NFC phone tap - through one request, polling,
  webhook and metering model, and adds standalone validation, timestamping and long-term-validation (LTV)/archive trust services;
  contract 1.4.0 withdrew the short-lived Smart-ID and Mobile-ID passthrough, so the ATK surface is deliberately card-only.
  Hosted remote-method ceremonies moved to the separate Tvarka Sign API (sign-api.tvarka.pro), an orchestration contract with
  RFC 9457 problem details and a live, anonymously introspectable MCP server at /mcp. eIDAS-aligned and EU-resident, operated
  from Lithuania by Advokato M. Kiskio kontora INVENT and Socialiniai algoritmai, UAB, and priced per successful operation
  with no subscription or minimum.
