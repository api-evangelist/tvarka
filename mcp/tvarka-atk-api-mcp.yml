agent_notes:
- 'Every write path is a legally significant ceremony: a completed auth is a verified national eID identity
  and a completed sign is a qualified electronic signature with legal effect under eIDAS.'
- The provider Basic credential must never be handed to an agent-facing client; only the request-scoped
  clientToken is safe outside the backend.
- Idempotency-Key is REQUIRED on validateDocument, timestampDocument and archiveDocument.
- See agentic-access/tvarka-atk-api-agentic-access.yml for per-operation execution contracts.
