x-recheck:
  date: '2026-08-31'
  findings:
    - >-
      Contract moved 1.3.0 -> 1.4.0 and NARROWED: the Smart-ID and Mobile-ID method enum values were
      removed. The provider handled it as a withdrawal rather than a deprecation - there was no
      Sunset header, no deprecation notice and no transition window, on the stated grounds that no
      provider had been entitled to the methods. This is the first observed exercise of the
      published compatibility policy, and it was a removal, so the policy's claim that "a breaking
      request or response change requires a new major resource family" was not applied to it.
    - >-
      Machine-readable status now confirmed: https://atk.tvarka.pro/status.json (200, JSON snapshot
      with per-component state and a 90-day incident window), https://atk.tvarka.pro/status/feed.xml
      (200, Atom) and https://atk.tvarka.pro/health/ (200, "OK") - an independent host reachability
      probe the status page names for automated monitoring.
    - >-
      RFC 8594 Sunset / Deprecation response headers are still not documented and still not present.
