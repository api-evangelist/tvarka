domain_standard_signature:
  generated: '2026-08-31'
  method: derived
  market: qualified trust services / electronic signatures (eIDAS)
  present: true
  summary: >-
    Both contracts declare conformance to the electronic-signature interoperability standards of
    their own market, IN THE CONTRACT rather than only on a marketing page. A buyer who already
    speaks PAdES/XAdES/ASiC integrates with no bespoke connector; one who does not needs a bilateral
    one. This is the domain-standard signature for this sector, recorded with the exact spec
    locations that carry it.
  signatures:
    - standard: ETSI EN 319 142 (PAdES)
      where: 'openapi/_original/tvarka-atk-api-openapi-original.json -> components.schemas.SignFormat enum value "pades"'
      note: >-
        The ATK archive service upgrades a PAdES B-T signature to B-LT by embedding the certificate
        chain and fresh revocation evidence as DSS/VRI (archiveDocument description).
    - standard: ETSI EN 319 132 (XAdES)
      where: 'openapi/tvarka-sign-api-openapi.yml -> archiveSigning description, "ASiC-E goes XAdES-T to XAdES-LT"'
    - standard: ETSI EN 319 122 (CAdES)
      where: 'openapi/_original/tvarka-atk-api-openapi-original.json -> components.schemas.SignFormat enum value "cades" (detached)'
    - standard: ETSI EN 319 162 (ASiC / ASiC-E)
      where: 'SignFormat enum value "asice" (ATK); openapi/tvarka-sign-api-openapi.yml info.description accepts appendable ASiC-E containers (.asice, .sce, .bdoc)'
    - standard: ADOC-V1.0 (Lithuanian national signed-document container)
      where: 'SignFormat enum value "adoc" (ATK); Sign API accepts the .adoc/.bedoc/.cedoc/.gedoc/.ggedoc family for countersigning'
      note: >-
        A NEGATIVE conformance statement in the contract, which is the strongest kind: archiveSigning
        refuses ADOC by name because "ADOC-V1.0 specifies XAdES-T and its validators expect that
        level, so upgrading one would be a conformance risk dressed as a favour."
    - standard: Regulation (EU) 2026/248 Annex I signature families
      where: 'openapi/_original/tvarka-sign-api-openapi-original.json -> info.description, "The complete Tvarka API estate produces every Regulation (EU) 2026/248 Annex I family: PAdES, XAdES, CAdES, JAdES and ASiC."'
    - standard: eIDAS qualified-signature validation levels
      where: 'ATK contract models a QUALIFIED_VALID validation level and a not_qualified (422) rejection code'
  caveat: >-
    Recorded as a contract-level DECLARATION. Nothing here was independently conformance-tested
    against an ETSI test suite, and Tvarka publishes no ETSI/eIDAS conformity-assessment report of
    its own - it states that qualified signatures are produced THROUGH qualified trust service
    providers (QTSPs), i.e. the qualification sits with the QTSP, not with this API.

